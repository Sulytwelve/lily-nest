<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lily Apps：浏览本站可直接使用的网页工具和小游戏。" />
    <title>Lily Apps</title>
    <link rel="alternate" type="text/markdown" href="{{markdown_url}}" />
    {{custom_head}}
    <link rel="stylesheet" href="/css/md-theme.css" />
    <link rel="stylesheet" href="/css/user-theme.css" />
    <link rel="stylesheet" href="/css/apps.css" />
    <script type="module" src="/js/vendor/MaterialWeb.js"></script>
  </head>
  <body>
    <div class="top-app-bar">
      <md-icon-button href="/" title="返回梨窝" aria-label="返回梨窝">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </md-icon-button>
    </div>

    <header class="hero-section">
      <div class="hero-card">
        <h1 class="hero-title" id="page-title">Lily Apps</h1>
        <p class="hero-subtitle">工具与游戏都在这里。无需安装，选择一个就能开始。</p>
        <p class="app-count"><strong>{{app_count}}</strong> 个应用</p>
      </div>
    </header>

    <main aria-labelledby="page-title">
      <nav class="filters" aria-label="应用分类筛选">
        {{filter_links}}
      </nav>
      <div class="catalog">
        {{app_sections}}
      </div>
    </main>
    {{footer_html}}
  </body>
</html>
