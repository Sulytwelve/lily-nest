<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>梨窝 | 后台管理</title>
    
    <link rel="stylesheet" href="/css/md-theme.css">
    <link rel="stylesheet" href="/css/user-theme.css">
    <link rel="stylesheet" href="/css/admin.css">
    
    <script type="module" src="/js/vendor/MaterialWeb.js"></script>
    <script type="application/json" id="auth-config-json">{{auth_config_json}}</script>
    <script src="/js/admin.js" defer></script>
</head>
<body>
    <!-- Top App Bar -->
    <div class="top-app-bar">
        <div class="top-app-bar-left">
            <md-icon-button href="/" title="Back to Home">
                <md-icon>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </md-icon>
            </md-icon-button>
            <span class="app-bar-title">控制面板</span>
            
            <div class="nav-tabs">
                <md-filled-tonal-button id="navIndexBtn">
                    配置管理
                    <svg slot="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z"/></svg>
                </md-filled-tonal-button>
                <md-text-button id="navNoteBtn">
                    梨记管理
                    <svg slot="icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                </md-text-button>
            </div>
        </div>
        <div class="top-app-bar-right">
            <md-icon-button disabled title="Settings">
                <md-icon>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </md-icon>
            </md-icon-button>
            <md-icon-button id="logout-btn" title="Logout">
                <md-icon>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                </md-icon>
            </md-icon-button>
        </div>
    </div>

    <!-- VIEW 1: Config Management -->
    <main id="viewConfig" class="admin-content view-section">
        <div class="editor-grid">
            <div class="file-list-container">
                <span class="config-label">CONFIG FILES</span>
                <div class="config-list-wrapper">
                    <md-list id="config-list"></md-list>
                </div>
            </div>
            <div class="editor-box">
                <div class="editor-toolbar">
                    <h2 id="current-filename" class="md-typescale-title-large">No file selected</h2>
                    <md-filled-button id="save-btn" disabled>Save</md-filled-button>
                </div>
                <textarea id="editor" placeholder="Select a configuration file to edit..." spellcheck="false"></textarea>
                <div id="status-text" class="status-info">Ready</div>
            </div>
        </div>
    </main>

    <!-- VIEW 2: Note Management -->
    <main id="viewNote" class="admin-content view-section" style="display: none;">
        <div id="notesContainer" class="notes-grid">
            <!-- Notes loaded via JS -->
        </div>
        <md-fab id="addNoteFab" variant="primary" class="add-fab" aria-label="Add Note">
            <md-icon slot="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </md-icon>
        </md-fab>
    </main>

    <!-- Editor Overlay (for Note Management) -->
    <div id="editorOverlay" class="editor-overlay">
        <div class="editor-header">
            <md-icon-button id="closeEditorBtn" title="Close">
                <md-icon>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </md-icon>
            </md-icon-button>
            <span class="editor-title" id="editorTitleText">新建梨记</span>
            <md-filled-button id="saveNoteBtn">保存</md-filled-button>
        </div>
        <div class="editor-body">
            <md-outlined-text-field id="editTitle" label="标题" type="text" class="w-full"></md-outlined-text-field>
            
            <div class="tags-section">
                <md-outlined-text-field id="tagInput" label="输入新标签并按回车..." type="text" class="w-full"></md-outlined-text-field>
                <md-chip-set id="selectedTagsSet" class="tags-set-selected"></md-chip-set>
                <div class="tags-available-label">已有标签 (点击快速添加):</div>
                <md-chip-set id="availableTagsSet" class="tags-set-available"></md-chip-set>
            </div>

            <md-outlined-text-field id="editExcerpt" label="摘要 (可选)" type="textarea" rows="2" class="w-full"></md-outlined-text-field>
            <textarea id="editContent" class="markdown-textarea" placeholder="在这里编写 Markdown 内容..."></textarea>
            <div id="noteEditorStatus" class="status-info">可直接粘贴剪贴板图片，自动上传并插入 Markdown</div>
        </div>
    </div>

    <!-- Authentication Dialog -->
    <md-dialog id="auth-dialog">
        <div slot="headline">Authentication Required</div>
        <div slot="content">
            <p>Please enter the admin password and answer the security question.</p>
            <md-outlined-text-field id="password-input" label="Password" type="password" style="margin-bottom: 16px; width: 100%;"></md-outlined-text-field>
            <div id="security-question-container"></div>
        </div>
        <div slot="actions">
            <md-text-button id="login-confirm-btn">Login</md-text-button>
        </div>
    </md-dialog>

    <!-- First-time Setup Dialog -->
    <md-dialog id="setup-dialog">
        <div slot="headline">管理员初始化</div>
        <div slot="content">
            <p>请输入启动日志中的 Setup Code，并设置新的管理员密码（至少 8 个字符）。</p>
            <md-outlined-text-field id="setup-code-input" label="Setup Code" type="password" style="margin-bottom: 16px; width: 100%;"></md-outlined-text-field>
            <md-outlined-text-field id="setup-password-input" label="New Password" type="password" style="margin-bottom: 16px; width: 100%;"></md-outlined-text-field>
            <md-outlined-text-field id="setup-confirm-input" label="Confirm Password" type="password" style="margin-bottom: 16px; width: 100%;"></md-outlined-text-field>
            <div id="setup-status-text" class="status-info"></div>
        </div>
        <div slot="actions">
            <md-text-button id="setup-confirm-btn">Initialize</md-text-button>
        </div>
    </md-dialog>
</body>
</html>
