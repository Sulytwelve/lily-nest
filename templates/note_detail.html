<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - 梨记</title>
  
  
  <link rel="stylesheet" href="/css/md-theme.css">
  <link rel="stylesheet" href="/css/user-theme.css">

  <script type="module" src="/js/MaterialWeb.js"></script>
  <script src="/js/note_detail.js" defer></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        min-height: 100vh; display: flex; flex-direction: column; 
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        scroll-behavior: smooth;
    }
    
    .reader-header {
      padding: 1rem 3vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(251, 253, 249, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
    }

    .reader-scroll-area {
      flex: 1;
      padding: 0 5vw 6rem;
    }
    
    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Markdown 渲染样式 */
    .markdown-body {
      max-width: 720px;
      margin: 3rem auto 0;
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--md-sys-color-on-surface);
    }

    .markdown-body h1 { 
      font-size: clamp(2rem, 5vw, 3rem); 
      margin-bottom: 2rem; 
      color: var(--md-sys-color-on-surface);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    
    .markdown-body .article-meta {
      display: flex;
      gap: 1rem;
      color: var(--md-sys-color-outline);
      font-size: 0.9rem;
      margin-bottom: 3rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .markdown-body h2 { font-size: 1.75rem; margin-top: 3rem; margin-bottom: 1rem; border-bottom: 1px solid var(--md-sys-color-surface-variant); padding-bottom: 0.5rem; }
    .markdown-body h3 { font-size: 1.35rem; margin-top: 2rem; margin-bottom: 0.75rem; }
    .markdown-body p { margin-bottom: 1.5rem; }
    .markdown-body ul, .markdown-body ol { margin-bottom: 1.5rem; padding-left: 2rem; }
    .markdown-body li { margin-bottom: 0.5rem; }
    
    .markdown-body code {
      background: var(--md-sys-color-surface-variant);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9em;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .markdown-body pre {
      background: #191C1A;
      color: #E3E3E3;
      padding: 1.5rem;
      border-radius: 16px;
      overflow-x: auto;
      margin-bottom: 2rem;
    }
    .markdown-body pre code { background: none; padding: 0; color: inherit; }
    
    .markdown-body blockquote {
      border-left: 4px solid var(--md-sys-color-primary);
      padding: 1rem 1.5rem;
      margin-left: 0;
      background: var(--md-sys-color-surface-variant);
      border-radius: 0 16px 16px 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .markdown-body img { max-width: 100%; border-radius: 12px; margin: 1.5rem 0; }
  </style>
</head>
<body>
  <div class="reader-header">
    <md-icon-button href="/note" title="Back">
      <md-icon>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </md-icon>
    </md-icon-button>
    <div class="header-actions">
      <md-icon-button id="copyMdBtn" title="复制 Markdown 原文">
        <md-icon style="color: var(--md-sys-color-primary);">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm210-360h60v-180h40v120h60v-120h40v180h60v-200q0-17-11.5-28.5T630-680H450q-17 0-28.5 11.5T410-640v200Zm-50 120v-480 480Z"/></svg>
        </md-icon>
      </md-icon-button>
      <md-icon-button id="shareBtn" title="Share">
        <md-icon style="color: var(--md-sys-color-on-surface);">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        </md-icon>
      </md-icon-button>
    </div>
  </div>
  
  <div class="reader-scroll-area">
    <article class="markdown-body">
      <h1>{{title}}</h1>
      <div class="article-meta">
        <span>发布日期: <time datetime="{{date}}">{{date}}</time></span>{{updated_at_html}}
      </div>
      <div class="content">
        {{content}}
      </div>
    </article>
  </div>
</body>
</html>
