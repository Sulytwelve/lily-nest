<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{note_title}}</title>
    <meta name="description" content="{{note_description}}">
    <meta name="keywords" content="{{note_keywords}}">

    <!-- 引入主题和全局 CSS -->
    <link rel="stylesheet" href="/css/md-theme.css">
    <link rel="stylesheet" href="/css/user-theme.css">

    <!-- 引入当前页面的专用 CSS -->
    <link rel="stylesheet" href="/css/note.css">

    <!-- 引入 Material Web Components (可选) -->
    <script type="module" src="/js/MaterialWeb.js"></script>
</head>

<body>

    <div class="top-app-bar">
        <md-icon-button href="/" title="返回梨窝">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
        </md-icon-button>
    </div>

    <header class="hero-section">
        <!-- 标题卡片 -->
        <div class="hero-card">
            <h1 class="hero-title">梨记</h1>
            <div class="hero-subtitle">记录每一次进步 by Suly.</div>
        </div>
    </header>

    <main>
        <div class="notes-grid" id="mainNotesList">
            {{notes_html}}
        </div>
    </main>

    <!-- 搜索悬浮按钮 (FAB) -->
    <button class="search-fab" id="searchFab" title="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
        </svg>
    </button>

    <!-- 沉浸式搜索全屏遮罩 -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="var(--md-sys-color-primary)">
                <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            <input type="text" id="searchInput" class="search-input-large" placeholder="Search keywords, tags...">
        </div>
        <div class="search-results-area">
            <div class="notes-grid" id="searchResultsList">
                <!-- 搜索结果卡片由 JS 渲染 -->
            </div>
        </div>
    </div>

    <!-- 当前页面的交互逻辑 -->
    <script id="notes-data" type="application/json">
    {{notes_json}}
  </script>
    <script src="/js/note.js" defer></script>
</body>

</html>
