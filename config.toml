[tls]
# cert_path = "./certs/example.com.pem"
# key_path  = "./certs/example.com.key"

[assets]
assets_dirs = ["./static/css", "./static/js", "./static/fonts"]
target_exts = ["css", "js", "woff", "woff2", "ttf", "otf"]
compression_types = ["br", "gz"]
brotli_quality = 5
gzip_level = 6

[security]
# allow_origins = [
#     "https://example.com",
#     "https://cloudflareinsights.com",
# ]
allow_origins = ["*"]
csp_policy = """
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
connect-src 'self'; \
font-src 'self'; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'\
"""
permissions_policy = "camera=(), microphone=(), geolocation=(), payment=()"
