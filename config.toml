[server]
http_port = 8880
https_port = 8443

[tls]
# cert_path = "./certs/example.com.pem"
# key_path  = "./certs/example.com.key"

[assets]
precompress = false
assets_dirs = ["./static/css", "./static/css/vendor", "./static/css/vendor/fonts", "./static/js", "./static/js/vendor", "./static/fonts", "./static/fonts/vendor"]
target_exts = ["css", "js", "woff", "woff2", "ttf", "otf"]
compression_types = ["br"]                                      # ["zst", "br", "gz"]
zstd_level = 3
brotli_quality = 11
gzip_level = 9

# 缓存时长配置 (秒)
html_cache_seconds = 3600             # 主页 HTML 缓存时长，默认 1 小时
js_css_cache_seconds = 86400          # JS 和 CSS 资源缓存时长，默认 1 天
image_cache_seconds = 86400           # 图片资源缓存时长，默认 1 天
font_cache_seconds = 604800           # 字体资源（woff, woff2, ttf 等）缓存时长，默认 7 天
other_cache_seconds = 3600            # 其他根目录文件（robots.txt, favicon.ico 等）缓存时长，默认 1 小时

[security]
# 跨域白名单：管理后台与 Agent 接口均同源/机器调用，不需要 CORS。
# 如需跨域访问公开 API（/api/v1/home/profile、/api/v1/health），在这里添加真实源站。
allow_origins = []
# 仅当 TCP 对端是这些 IP（或 loopback，如本机 cloudflared）时才信任
# cf-connecting-ip / x-forwarded-* 等代理头；留空 = 只信 loopback。
trusted_proxy_ips = []
admin_password = "CHANGE_YOUR_PASSWORD"
admin_security_answers = ["default1", "default2", "default3"]
admin_security_questions = ["default1", "default2", "default3"]
auth_ext_secq = false
auth_ext_cftrace = false
cftrace_url = "example.com"
allowed_locs = ["CN", "US"]
csp_policy = """
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
connect-src 'self' https://cloudflare.com https://*.cloudflare.com; \
font-src 'self'; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'\
"""
permissions_policy = "camera=(), microphone=(), geolocation=(), payment=()"

[cloudflare]
# Cloudflare Web Analytics 令牌 (Token)
# 如果留空或注释，则不注入任何分析代码。
# web_analytics_token = "YOUR_CLOUDFLARE_ANALYTICS_TOKEN"

[markdown]
enable = false




