[package]
name = "lily-nest"
version = "0.2.8"
edition = "2024"

[features]
force-http = []

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
brotli = "8.0.3"
bytes = "1"
flate2 = "1.1.9"
httpdate = "1"
jsonwebtoken = "9"
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower-http = { version = "0.6.11", features = ["fs", "cors", "trace", "set-header"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.13.3"
